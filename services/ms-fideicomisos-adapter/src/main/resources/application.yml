spring:
  application:
    name: ms-fideicomisos-adapter
  datasource:
    url: jdbc:postgresql://localhost:5433/direcciones_fiscales
    username: labuser
    password: labpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
