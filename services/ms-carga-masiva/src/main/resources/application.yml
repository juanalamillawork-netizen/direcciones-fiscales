spring:
  application:
    name: ms-carga-masiva
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
  fideicomisos-adapter:
    base-url: ${FIDEICOMISOS_ADAPTER_URL:http://localhost:8082}  

server:
  port: ${PORT:${SERVER_PORT:8084}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: TRACE