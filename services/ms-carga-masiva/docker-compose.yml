services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-carga-masiva-postgres
    environment:
      POSTGRES_DB: ms_carga_masiva
      POSTGRES_USER: carga
      POSTGRES_PASSWORD: carga_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carga -d ms_carga_masiva"]
      interval: 5s
      timeout: 5s
      retries: 10

  fideicomisos-adapter:
    image: wiremock/wiremock:3.9.1
    container_name: ms-carga-masiva-fideicomisos-mock
    ports:
      - "8082:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro
    command: ["--global-response-templating", "--verbose"]

  ms-carga-masiva:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-carga-masiva:dev
    container_name: ms-carga-masiva
    depends_on:
      postgres:
        condition: service_healthy
      fideicomisos-adapter:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8084:8080"
    restart: unless-stopped

volumes:
  pgdata: 